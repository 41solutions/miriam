<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miriam - Law Student Study Suite</title>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background-color: #334155;
      border-radius: 3px;
    }
    .scrollbar-thin::-webkit-scrollbar-track {
      background-color: #1e293b;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- MOCK / PRELOADED CODAL DATA ---
    const INITIAL_CODALS = [
      {
        id: "rpc-248",
        code: "Revised Penal Code",
        article: "Art. 248 - Murder",
        title: "Murder",
        text: "Any person who, not falling within the provisions of Article 246 shall kill another, shall be guilty of murder and shall be punished by reclusion perpetua, to death...",
        elements: [
          "That a person was killed.",
          "That the accused killed him.",
          "That the killing was attended by any of the qualifying circumstances (Treachery, Inconsideration, Price/Reward, Inundation, Poison, premeditation, etc.).",
          "That the killing is not parricide or infanticide."
        ]
      },
      {
        id: "civ-1156",
        code: "Civil Code",
        article: "Art. 1156 - Obligations",
        title: "Definition of Obligation",
        text: "An obligation is a juridical necessity to give, to do or not to do.",
        elements: [
          "Active Subject (Creditor/Obligee) - Has the power to demand performance.",
          "Passive Subject (Debtor/Obligor) - Bound to perform the prestation.",
          "Object or Prestation - The subject matter (to give, to do, or not to do).",
          "Juridical or Legal Tie (Vinculum Juris) - Binds the parties to the obligation."
        ]
      },
      {
        id: "consti-art3-sec1",
        code: "Constitution",
        article: "Art. III, Sec. 1 - Due Process",
        title: "Due Process & Equal Protection",
        text: "No person shall be deprived of life, liberty, or property without due process of law, nor shall any person be denied the equal protection of the laws.",
        elements: [
          "Procedural Due Process: Notice and Opportunity to be heard before an impartial tribunal.",
          "Substantive Due Process: The law itself must be fair, reasonable, and just, not arbitrary or oppressive."
        ]
      }
    ];

    const INITIAL_FLASHCARDS = [
      { id: 1, front: "What are the 4 essential requisites of an Obligation (Art. 1156)?", back: "1. Active Subject (Creditor)\n2. Passive Subject (Debtor)\n3. Object/Prestation\n4. Vinculum Juris (Juridical Tie)", interval: 1, box: 1 },
      { id: 2, front: "Define Treachery (Alevosia) under Article 14(16).", back: "Employing means, methods, or forms in execution to insure safety from defense by the offended party, consciously adopting such mode of attack.", interval: 2, box: 2 },
      { id: 3, front: "What is Procedural Due Process?", back: "A law which hears before it condemns, which proceeds upon inquiry, and renders judgment only after trial. Key elements: Notice + Opportunity to be heard.", interval: 4, box: 3 }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('digest');
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('miriam_gemini_key') || '');
      const [selectedModel, setSelectedModel] = useState(() => localStorage.getItem('miriam_gemini_model') || 'gemini-2.5-flash');
      
      // Digest State
      const [imagePreview, setImagePreview] = useState(null);
      const [rawText, setRawText] = useState('');
      const [digest, setDigest] = useState(null);
      const [loading, setLoading] = useState(false);
      const [wpm, setWpm] = useState(180);

      // Saved Library State
      const [savedDigests, setSavedDigests] = useState(() => {
        const local = localStorage.getItem('miriam_saved_digests');
        return local ? JSON.parse(local) : [
          {
            id: 'demo-1',
            title: 'People v. Oinis (G.R. No. L-17774)',
            date: 'Sample Digest',
            facts: 'Accused officers shot a person sleeping in a dark room believing he was an escaped bandit named Balagtas.',
            issue: 'Whether or not mistake of fact excuses criminal liability in this scenario.',
            ratio: 'Mistake of fact relieves liability ONLY if done without fault, negligence, or carelessness. The officers acted recklessly by firing immediately.'
          }
        ];
      });

      // Codal State
      const [codals, setCodals] = useState(INITIAL_CODALS);
      const [codalSearch, setCodalSearch] = useState('');

      // Flashcards State
      const [flashcards, setFlashcards] = useState(() => {
        const local = localStorage.getItem('miriam_flashcards');
        return local ? JSON.parse(local) : INITIAL_FLASHCARDS;
      });
      const [currentCardIdx, setCurrentCardIdx] = useState(0);
      const [showAnswer, setShowAnswer] = useState(false);

      // Save settings to LocalStorage
      useEffect(() => {
        localStorage.setItem('miriam_gemini_key', apiKey);
      }, [apiKey]);

      useEffect(() => {
        localStorage.setItem('miriam_gemini_model', selectedModel);
      }, [selectedModel]);

      useEffect(() => {
        localStorage.setItem('miriam_saved_digests', JSON.stringify(savedDigests));
      }, [savedDigests]);

      useEffect(() => {
        localStorage.setItem('miriam_flashcards', JSON.stringify(flashcards));
      }, [flashcards]);

      // Handle Image Upload
      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setImagePreview(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      // Call Gemini API directly
      const runGeminiDigest = async () => {
        if (!rawText.trim() && !imagePreview) {
          alert("Please enter case text or upload an image first!");
          return;
        }

        setLoading(true);
        try {
          if (!apiKey) {
            // Simulated Response if Key is Missing
            setTimeout(() => {
              setDigest({
                title: "Generated Digest (Demo Mode - No Key Set)",
                facts: rawText ? rawText.slice(0, 300) + "..." : "Extracted facts from uploaded image of book page regarding party claims and lower court decisions.",
                issue: "Whether or not the elements of the crime/cause of action were sufficiently established beyond reasonable doubt.",
                ratio: "The Supreme Court held that statutory compliance must be strictly observed. (Configure your Gemini API Key in Settings for live AI generations!)."
              });
              setLoading(false);
            }, 1200);
            return;
          }

          const promptText = `You are Miriam, a premier legal assistant for law students. Analyze the provided legal text/image and generate a structured legal case digest.

Respond strictly in valid JSON format with the following keys:
{
  "title": "Case Name & G.R. No. or Title",
  "facts": "Concise chronological summary of facts (parties, events, procedure)",
  "issue": "Formulated clearly as 'Whether or not...'",
  "ratio": "The ruling, doctrine, and Supreme Court rationale"
}`;

          let payloadContents = [];

          if (imagePreview) {
            const base64Data = imagePreview.split(',')[1];
            const mimeType = imagePreview.split(';')[0].split(':')[1] || 'image/jpeg';
            payloadContents = [{
              parts: [
                { text: promptText + (rawText ? `\nAdditional Context:\n${rawText}` : '') },
                { inline_data: { mime_type: mimeType, data: base64Data } }
              ]
            }];
          } else {
            payloadContents = [{
              parts: [
                { text: `${promptText}\n\nLEGAL TEXT:\n${rawText}` }
              ]
            }];
          }

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: payloadContents,
              generationConfig: { response_mime_type: "application/json" }
            })
          });

          const data = await response.json();
          if (data.error) throw new Error(data.error.message);

          const aiText = data.candidates[0].content.parts[0].text;
          const parsedJSON = JSON.parse(aiText);
          setDigest(parsedJSON);

        } catch (err) {
          alert("Error generating digest: " + err.message);
        } finally {
          setLoading(false);
        }
      };

      const saveCurrentDigest = () => {
        if (!digest) return;
        const newEntry = {
          id: Date.now().toString(),
          title: digest.title || 'Untitled Case Digest',
          date: new Date().toLocaleDateString(),
          facts: digest.facts,
          issue: digest.issue,
          ratio: digest.ratio
        };
        setSavedDigests([newEntry, ...savedDigests]);
        alert("Digest saved to local storage!");
      };

      const createCardFromRatio = () => {
        if (!digest) return;
        const newCard = {
          id: Date.now(),
          front: `What was held in ${digest.title}? (Issue: ${digest.issue})`,
          back: digest.ratio,
          interval: 1,
          box: 1
        };
        setFlashcards([...flashcards, newCard]);
        alert("Created new flashcard from this digest!");
      };

      // Reading Time Calculator
      const totalWords = (rawText.trim().split(/\s+/).filter(Boolean).length) || (digest ? (digest.facts + digest.issue + digest.ratio).split(/\s+/).length : 0);
      const estMinutes = Math.ceil(totalWords / wpm);

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          {/* Header */}
          <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 font-bold text-xl shadow-inner">
                M
              </div>
              <div>
                <h1 className="font-bold text-lg text-slate-100 flex items-center gap-2">
                  MIRIAM <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">Zero-Backend</span>
                </h1>
                <p className="text-xs text-slate-400">Local Law Student Assistant & Case Digest Engine</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <nav className="flex items-center bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs font-medium">
              <button 
                onClick={() => setActiveTab('digest')}
                className={`px-3 py-1.5 rounded-md transition-all ${activeTab === 'digest' ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                Case & Book Summarizer
              </button>
              <button 
                onClick={() => setActiveTab('codal')}
                className={`px-3 py-1.5 rounded-md transition-all ${activeTab === 'codal' ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                Codal Elements
              </button>
              <button 
                onClick={() => setActiveTab('flashcards')}
                className={`px-3 py-1.5 rounded-md transition-all ${activeTab === 'flashcards' ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                Flashcards ({flashcards.length})
              </button>
              <button 
                onClick={() => setActiveTab('library')}
                className={`px-3 py-1.5 rounded-md transition-all ${activeTab === 'library' ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                Saved Library ({savedDigests.length})
              </button>
              <button 
                onClick={() => setActiveTab('settings')}
                className={`px-3 py-1.5 rounded-md transition-all ${activeTab === 'settings' ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                Settings {apiKey ? '⚙️' : '⚠️'}
              </button>
            </nav>
          </header>

          {/* Main Workspace */}
          <main className="flex-1 p-6 max-w-7xl mx-auto w-full">
            {/* TAB 1: DIGEST & OCR */}
            {activeTab === 'digest' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                {/* Input Panel */}
                <div className="lg:col-span-5 space-y-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm">
                    <h2 className="text-sm font-semibold text-slate-200 mb-3 flex items-center justify-between">
                      <span>Source Reading Material</span>
                      <span className="text-xs text-slate-400 font-normal">Book Scan or Case Text</span>
                    </h2>

                    {/* File Dropzone */}
                    <div className="border-2 border-dashed border-slate-700 hover:border-amber-500/50 rounded-lg p-4 text-center transition-colors bg-slate-950/50 cursor-pointer relative mb-4">
                      <input 
                        type="file" 
                        accept="image/*" 
                        onChange={handleImageUpload} 
                        className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                      />
                      {imagePreview ? (
                        <div className="relative group">
                          <img src={imagePreview} alt="Uploaded page" className="max-h-48 mx-auto rounded border border-slate-700 object-contain" />
                          <p className="text-xs text-amber-400 mt-2">Click or drop to replace image</p>
                        </div>
                      ) : (
                        <div className="space-y-2 py-2">
                          <div className="text-2xl">📸</div>
                          <p className="text-xs text-slate-300 font-medium">Upload or snap image of book page / case</p>
                          <p className="text-[10px] text-slate-500">Supports JPG, PNG (Direct Gemini Multimodal AI)</p>
                        </div>
                      )}
                    </div>

                    {/* Raw Text Input */}
                    <div>
                      <label className="text-xs text-slate-400 mb-1 block">Or paste case text / syllabus excerpt:</label>
                      <textarea
                        value={rawText}
                        onChange={(e) => setRawText(e.target.value)}
                        placeholder="Paste long court decision, law article, or notes here..."
                        className="w-full h-40 bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-200 focus:outline-none focus:border-amber-500 scrollbar-thin resize-none"
                      />
                    </div>

                    {/* Reading Estimator Bar */}
                    <div className="mt-3 p-3 bg-slate-950/80 rounded-lg border border-slate-800 flex items-center justify-between text-xs">
                      <span className="text-slate-400">Estimated Reading Time:</span>
                      <span className="font-bold text-amber-400">{estMinutes} min ({totalWords} words)</span>
                    </div>

                    <button
                      onClick={runGeminiDigest}
                      disabled={loading}
                      className="w-full mt-4 py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold rounded-lg transition-all shadow flex items-center justify-center gap-2 text-xs"
                    >
                      {loading ? (
                        <span>Analyzing with Gemini AI...</span>
                      ) : (
                        <>⚡ Auto-Generate Digest {apiKey ? '' : '(Demo Mode)'}</>
                      )}
                    </button>
                  </div>
                </div>

                {/* Digest Output Panel */}
                <div className="lg:col-span-7">
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm h-full flex flex-col">
                    <div className="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                      <h2 className="text-sm font-semibold text-slate-200">Structured Case Digest</h2>
                      {digest && (
                        <div className="flex gap-2">
                          <button onClick={createCardFromRatio} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs rounded border border-slate-700 transition">
                            + Make Flashcard
                          </button>
                          <button onClick={saveCurrentDigest} className="px-2.5 py-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded transition">
                            Save to Library
                          </button>
                        </div>
                      )}
                    </div>

                    {digest ? (
                      <div className="space-y-4 text-xs overflow-y-auto pr-1 flex-1 scrollbar-thin">
                        <div className="p-3 bg-slate-950 rounded-lg border border-slate-800">
                          <span className="text-[10px] uppercase font-bold text-amber-400 block mb-1">Case Title / Citation</span>
                          <h3 className="font-bold text-sm text-slate-100">{digest.title}</h3>
                        </div>

                        <div className="p-3 bg-slate-950 rounded-lg border border-slate-800">
                          <span className="text-[10px] uppercase font-bold text-blue-400 block mb-1">Statement of Facts</span>
                          <p className="text-slate-300 leading-relaxed whitespace-pre-wrap">{digest.facts}</p>
                        </div>

                        <div className="p-3 bg-slate-950 rounded-lg border border-slate-800">
                          <span className="text-[10px] uppercase font-bold text-amber-400 block mb-1">Legal Issue</span>
                          <p className="text-slate-200 font-medium italic">{digest.issue}</p>
                        </div>

                        <div className="p-3 bg-slate-950 rounded-lg border border-slate-800">
                          <span className="text-[10px] uppercase font-bold text-emerald-400 block mb-1">Held / Ratio Decidendi</span>
                          <p className="text-slate-300 leading-relaxed whitespace-pre-wrap">{digest.ratio}</p>
                        </div>
                      </div>
                    ) : (
                      <div className="flex-1 flex flex-col items-center justify-center text-center p-8 text-slate-500 border-2 border-dashed border-slate-800/60 rounded-lg">
                        <div className="text-3xl mb-2">⚖️</div>
                        <p className="text-xs font-medium text-slate-400">No digest generated yet</p>
                        <p className="text-[11px] max-w-xs mt-1">Upload a photo of your law textbook or paste case text on the left to extract Facts, Issue, and Ratio.</p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: CODAL BREAKDOWN */}
            {activeTab === 'codal' && (
              <div className="space-y-4">
                <div className="flex flex-col sm:flex-row gap-3 items-center justify-between bg-slate-900 p-4 rounded-xl border border-slate-800">
                  <input
                    type="text"
                    value={codalSearch}
                    onChange={(e) => setCodalSearch(e.target.value)}
                    placeholder="Search statutory codes (e.g. Murder, Art. 1156, Due Process)..."
                    className="w-full sm:w-96 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500"
                  />
                  <span className="text-xs text-slate-400">Instant offline element breakdown</span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {codals
                    .filter(c => c.article.toLowerCase().includes(codalSearch.toLowerCase()) || c.title.toLowerCase().includes(codalSearch.toLowerCase()))
                    .map(item => (
                      <div key={item.id} className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between items-start mb-2">
                            <span className="text-[10px] px-2 py-0.5 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded font-semibold">
                              {item.code}
                            </span>
                            <span className="text-xs font-bold text-slate-300">{item.article}</span>
                          </div>
                          <h3 className="text-sm font-bold text-slate-100 mb-2">{item.title}</h3>
                          <p className="text-xs text-slate-400 mb-3 italic bg-slate-950 p-2.5 rounded border border-slate-800/80">
                            "{item.text}"
                          </p>
                          <div>
                            <h4 className="text-[11px] font-bold text-slate-300 uppercase tracking-wider mb-1.5">Requisites / Elements:</h4>
                            <ul className="space-y-1">
                              {item.elements.map((el, i) => (
                                <li key={i} className="text-xs text-slate-300 flex items-start gap-2">
                                  <span className="text-amber-400 font-bold">•</span>
                                  <span>{el}</span>
                                </li>
                              ))}
                            </ul>
                          </div>
                        </div>
                      </div>
                    ))}
                </div>
              </div>
            )}

            {/* TAB 3: ACTIVE RECALL FLASHCARDS */}
            {activeTab === 'flashcards' && (
              <div className="max-w-2xl mx-auto space-y-6">
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-lg text-center">
                  <div className="flex justify-between text-xs text-slate-400 mb-4">
                    <span>Card {currentCardIdx + 1} of {flashcards.length}</span>
                    <span>Box {flashcards[currentCardIdx]?.box || 1} (Spaced Repetition)</span>
                  </div>

                  {flashcards.length > 0 ? (
                    <div 
                      onClick={() => setShowAnswer(!showAnswer)}
                      className="min-h-[220px] bg-slate-950 border border-slate-800 rounded-xl p-6 flex flex-col items-center justify-center cursor-pointer hover:border-slate-700 transition relative"
                    >
                      <span className="text-[10px] font-bold uppercase tracking-wider text-amber-500 mb-2">
                        {showAnswer ? 'ANSWER / RATIO' : 'QUESTION / PROMPT (Click to Flip)'}
                      </span>
                      <p className="text-sm md:text-base font-medium text-slate-100 whitespace-pre-wrap">
                        {showAnswer ? flashcards[currentCardIdx].back : flashcards[currentCardIdx].front}
                      </p>
                    </div>
                  ) : (
                    <p className="text-xs text-slate-400 py-8">No flashcards created yet.</p>
                  )}

                  {/* Rating Controls */}
                  {showAnswer && flashcards.length > 0 && (
                    <div className="flex gap-3 justify-center mt-6">
                      <button 
                        onClick={() => {
                          setShowAnswer(false);
                          setCurrentCardIdx((currentCardIdx + 1) % flashcards.length);
                        }}
                        className="px-4 py-2 bg-rose-500/20 text-rose-300 border border-rose-500/30 rounded-lg text-xs font-bold hover:bg-rose-500/30 transition"
                      >
                        Hard (Repeat Soon)
                      </button>
                      <button 
                        onClick={() => {
                          setShowAnswer(false);
                          setCurrentCardIdx((currentCardIdx + 1) % flashcards.length);
                        }}
                        className="px-4 py-2 bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-lg text-xs font-bold hover:bg-amber-500/30 transition"
                      >
                        Good
                      </button>
                      <button 
                        onClick={() => {
                          setShowAnswer(false);
                          setCurrentCardIdx((currentCardIdx + 1) % flashcards.length);
                        }}
                        className="px-4 py-2 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded-lg text-xs font-bold hover:bg-emerald-500/30 transition"
                      >
                        Easy (Mastered)
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB 4: SAVED LIBRARY */}
            {activeTab === 'library' && (
              <div className="space-y-4">
                <h2 className="text-sm font-semibold text-slate-200">Local Case Library</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {savedDigests.map(item => (
                    <div key={item.id} className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2">
                      <div className="flex justify-between items-start">
                        <h3 className="font-bold text-xs text-amber-400">{item.title}</h3>
                        <span className="text-[10px] text-slate-500">{item.date}</span>
                      </div>
                      <p className="text-xs text-slate-300 line-clamp-3"><strong>Facts:</strong> {item.facts}</p>
                      <p className="text-xs text-slate-300"><strong>Issue:</strong> {item.issue}</p>
                      <p className="text-xs text-slate-400 line-clamp-2"><strong>Ratio:</strong> {item.ratio}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 5: SETTINGS */}
            {activeTab === 'settings' && (
              <div className="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4">
                <h2 className="text-sm font-bold text-slate-100 border-b border-slate-800 pb-2">Gemini API Settings</h2>
                
                <div>
                  <label className="text-xs text-slate-300 block mb-1 font-medium">Google Gemini API Key:</label>
                  <input
                    type="password"
                    value={apiKey}
                    onChange={(e) => setApiKey(e.target.value)}
                    placeholder="AIzaSy..."
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500"
                  />
                  <p className="text-[10px] text-slate-500 mt-1">Get your free API key at <a href="https://aistudio.google.com" target="_blank" className="text-amber-400 underline">aistudio.google.com</a>. Stored locally in browser.</p>
                </div>

                <div>
                  <label className="text-xs text-slate-300 block mb-1 font-medium">AI Model:</label>
                  <select
                    value={selectedModel}
                    onChange={(e) => setSelectedModel(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500"
                  >
                    <option value="gemini-2.5-flash">Gemini 2.5 Flash (Recommended - Fastest & Multimodal)</option>
                    <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                  </select>
                </div>

                <div>
                  <label className="text-xs text-slate-300 block mb-1 font-medium">Target Reading Speed (Words Per Minute):</label>
                  <input
                    type="number"
                    value={wpm}
                    onChange={(e) => setWpm(Number(e.target.value))}
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500"
                  />
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
