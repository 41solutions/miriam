<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miriam - The Law Assistant</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Custom Butterfly + Scales Logo Component
    const ButterflyLogo = ({ className = "w-8 h-8" }) => (
      <svg className={className} viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        {/* Butterfly Left Wing */}
        <path d="M50 35 C35 10, 10 15, 15 45 C18 60, 35 60, 50 50" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" />
        <path d="M50 52 C35 55, 15 65, 20 85 C25 95, 42 85, 50 62" fill="rgba(245, 158, 11, 0.1)" stroke="#f59e0b" />
        
        {/* Butterfly Right Wing */}
        <path d="M50 35 C65 10, 90 15, 85 45 C82 60, 65 60, 50 50" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" />
        <path d="M50 52 C65 55, 85 65, 80 85 C75 95, 58 85, 50 62" fill="rgba(245, 158, 11, 0.1)" stroke="#f59e0b" />

        {/* Butterfly Body / Scales Center Beam */}
        <line x1="50" y1="20" x2="50" y2="80" stroke="#fbbf24" strokeWidth="3" />
        <circle cx="50" cy="18" r="3" fill="#fbbf24" />
        
        {/* Scales fulcrum and beam balance inside wings */}
        <path d="M30 40 L70 40" stroke="#f59e0b" strokeWidth="2" />
        
        {/* Left Scale Pan */}
        <path d="M30 40 L22 55 L38 55 Z" fill="rgba(251, 191, 36, 0.2)" stroke="#fbbf24" strokeWidth="1.5" />
        
        {/* Right Scale Pan */}
        <path d="M70 40 L62 55 L78 55 Z" fill="rgba(251, 191, 36, 0.2)" stroke="#fbbf24" strokeWidth="1.5" />
      </svg>
    );

    function MiriamApp() {
      const [activeTab, setActiveTab] = useState('digest');
      const [apiKey, setApiKey] = useState('');
      const [savedKey, setSavedKey] = useState('');
      const [inputText, setInputText] = useState('');
      const [loading, setLoading] = useState(false);
      const [digestResult, setDigestResult] = useState(null);
      const [selectedImage, setSelectedImage] = useState(null);
      const [imagePreview, setImagePreview] = useState(null);

      // Flashcards State
      const [flashcards, setFlashcards] = useState([
        { id: 1, question: "What are the elements of Homicide (Art. 249, RPC)?", answer: "1. That a person was killed.\n2. That the accused killed him without any justifying circumstance.\n3. That the accused had the intention to kill, which is presumed.\n4. That the killing was not attended by any of the qualifying circumstances of Murder, etc." },
        { id: 2, question: "Define Obligations under Art. 1156 of the Civil Code.", answer: "An obligation is a juridical necessity to give, to do or not to do." }
      ]);
      const [showAnswer, setShowAnswer] = useState({});

      // Codal Search State
      const [codalQuery, setCodalQuery] = useState('');
      const codals = [
        { art: "Art. 248 (RPC)", title: "Murder", details: "Any person who, not falling within the provisions of Article 246 shall kill another, shall be guilty of murder if committed with Treachery, In consideration of price/reward, By means of inundation/fire/poison, etc." },
        { art: "Art. 1156 (Civil Code)", title: "Obligations", details: "An obligation is a juridical necessity to give, to do or not to do." },
        { art: "Art. 1170 (Civil Code)", title: "Grounds for Damages", details: "Those who in the performance of their obligations are guilty of fraud, negligence, or delay, and those who in any manner contravene the tenor thereof, are liable for damages." }
      ];

      // Load saved API Key on startup
      useEffect(() => {
        const stored = localStorage.getItem('miriam_gemini_key');
        if (stored) {
          setSavedKey(stored);
          setApiKey(stored);
        }
      }, []);

      const saveKey = () => {
        localStorage.setItem('miriam_gemini_key', apiKey);
        setSavedKey(apiKey);
        alert('Gemini API Key saved locally!');
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          setSelectedImage(file);
          const reader = new FileReader();
          reader.onloadend = () => {
            setImagePreview(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const generateDigest = async () => {
        if (!savedKey) {
          alert('Please enter and save your Gemini API key in the Settings (⚙️) tab first!');
          setActiveTab('settings');
          return;
        }

        setLoading(true);
        try {
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${savedKey}`;
          
          let parts = [
            { text: `You are Miriam, an expert law study assistant. Analyze this case or book material and extract:
1. CASE TITLE & CITATION
2. FACTS (Key parties, chronological events)
3. ISSUE (Formulated as 'Whether or not...')
4. HELD / RATIO DECIDENDI (The legal doctrine & Supreme Court reasoning)

Format clearly with bold headers.` }
          ];

          if (imagePreview) {
            const base64Data = imagePreview.split(',')[1];
            parts.push({
              inline_data: {
                mime_type: selectedImage.type || "image/jpeg",
                data: base64Data
              }
            });
          } else if (inputText) {
            parts.push({ text: `\n\nLEGAL TEXT:\n${inputText}` });
          } else {
            alert('Please paste case text or upload an image of a book page.');
            setLoading(false);
            return;
          }

          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts }] })
          });

          const data = await response.json();
          if (data.candidates && data.candidates[0].content.parts[0].text) {
            setDigestResult(data.candidates[0].content.parts[0].text);
          } else {
            setDigestResult('Failed to generate digest. Please check your API Key or input.');
          }
        } catch (err) {
          console.error(err);
          setDigestResult('Error calling Gemini API: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      // Words per minute reading calculator
      const wordCount = inputText.trim() ? inputText.trim().split(/\s+/).length : 0;
      const readingTimeMinutes = Math.ceil(wordCount / 180);

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col">
          {/* Top Header */}
          <header className="border-b border-slate-800 bg-slate-950/80 backdrop-blur px-6 py-4 flex items-center justify-between sticky top-0 z-50">
            <div className="flex items-center gap-3">
              <ButterflyLogo className="w-10 h-10 text-amber-500" />
              <div>
                <h1 className="text-xl font-bold tracking-tight bg-gradient-to-r from-amber-400 via-amber-200 to-amber-500 bg-clip-text text-transparent">
                  MIRIAM
                </h1>
                <p className="text-xs text-slate-400">Zero-Backend Law Student Assistant</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <nav className="flex items-center gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800 text-sm">
              {[
                { id: 'digest', label: 'Case Digest Studio' },
                { id: 'codal', label: 'Interactive Codals' },
                { id: 'cards', label: 'Flashcards' },
                { id: 'settings', label: 'Settings ⚙️' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-4 py-2 rounded-lg font-medium transition-all ${
                    activeTab === tab.id
                      ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </nav>

            {/* Status Badge */}
            <div className="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-xs">
              <span className={`w-2 h-2 rounded-full ${savedKey ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'}`}></span>
              <span className="text-slate-400">{savedKey ? 'Gemini Connected' : 'No API Key Set'}</span>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 p-6 max-w-7xl mx-auto w-full">
            {/* TAB 1: CASE DIGEST STUDIO */}
            {activeTab === 'digest' && (
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                {/* Left Panel: Input & Image Upload */}
                <div className="bg-slate-950/60 border border-slate-800 rounded-2xl p-5 flex flex-col gap-4">
                  <h2 className="text-lg font-semibold text-amber-400 flex items-center gap-2">
                    <span>📖</span> Input Book Page or Case Text
                  </h2>

                  {/* Image Upload Area */}
                  <div className="border-2 border-dashed border-slate-800 hover:border-amber-500/50 rounded-xl p-4 text-center bg-slate-900/40 transition-colors">
                    <input
                      type="file"
                      accept="image/*"
                      onChange={handleImageUpload}
                      className="hidden"
                      id="book-image-input"
                    />
                    <label htmlFor="book-image-input" className="cursor-pointer flex flex-col items-center gap-2">
                      {imagePreview ? (
                        <img src={imagePreview} alt="Book Preview" className="max-h-48 rounded-lg object-contain border border-slate-700" />
                      ) : (
                        <>
                          <div className="w-12 h-12 rounded-full bg-amber-500/10 text-amber-400 flex items-center justify-center text-xl">📸</div>
                          <span className="text-sm font-medium text-slate-300">Upload or snap photo of book page</span>
                          <span className="text-xs text-slate-500">PNG, JPG, WEBP accepted</span>
                        </>
                      )}
                    </label>
                    {imagePreview && (
                      <button
                        onClick={() => { setImagePreview(null); setSelectedImage(null); }}
                        className="mt-2 text-xs text-rose-400 hover:underline"
                      >
                        Remove image
                      </button>
                    )}
                  </div>

                  <div className="relative flex items-center my-1">
                    <div className="flex-grow border-t border-slate-800"></div>
                    <span className="flex-shrink mx-4 text-xs text-slate-500 uppercase tracking-widest">or paste text</span>
                    <div className="flex-grow border-t border-slate-800"></div>
                  </div>

                  {/* Text Input */}
                  <textarea
                    value={inputText}
                    onChange={(e) => setInputText(e.target.value)}
                    placeholder="Paste long case text, syllabus excerpts, or decisions here..."
                    className="w-full h-44 bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500/50 text-slate-200 resize-none"
                  ></textarea>

                  {/* Reading Time Estimator */}
                  {wordCount > 0 && (
                    <div className="text-xs text-slate-400 flex items-center justify-between bg-slate-900/80 px-3 py-2 rounded-lg border border-slate-800">
                      <span>📊 Total Words: <strong className="text-slate-200">{wordCount}</strong></span>
                      <span>⏱️ Est. Reading Time: <strong className="text-amber-400">{readingTimeMinutes} min</strong></span>
                    </div>
                  )}

                  <button
                    onClick={generateDigest}
                    disabled={loading}
                    className="w-full py-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 font-semibold rounded-xl text-slate-950 transition-all flex items-center justify-center gap-2 shadow-lg shadow-amber-500/10 disabled:opacity-50"
                  >
                    {loading ? (
                      <>
                        <span className="animate-spin">⏳</span>
                        <span>Miriam is Digesting...</span>
                      </>
                    ) : (
                      <>
                        <ButterflyLogo className="w-5 h-5 text-slate-950" />
                        <span>Generate Auto-Digest with Gemini</span>
                      </>
                    )}
                  </button>
                </div>

                {/* Right Panel: Digest Output */}
                <div className="bg-slate-950/60 border border-slate-800 rounded-2xl p-5 flex flex-col">
                  <h2 className="text-lg font-semibold text-amber-400 mb-3 flex items-center gap-2">
                    <span>⚡</span> Structured Digest Output
                  </h2>

                  <div className="flex-1 bg-slate-900/90 border border-slate-800 rounded-xl p-4 overflow-y-auto font-mono text-sm leading-relaxed text-slate-300 whitespace-pre-wrap min-h-[350px]">
                    {digestResult ? (
                      digestResult
                    ) : (
                      <div className="h-full flex flex-col items-center justify-center text-slate-500 text-center gap-2 py-12">
                        <ButterflyLogo className="w-12 h-12 text-slate-700" />
                        <p>Upload a book photo or paste text and click "Generate" to build a structured Facts, Issue, and Ruling digest.</p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: INTERACTIVE CODALS */}
            {activeTab === 'codal' && (
              <div className="bg-slate-950/60 border border-slate-800 rounded-2xl p-6 flex flex-col gap-4">
                <h2 className="text-lg font-semibold text-amber-400">⚖️ Quick Codal & Element Search</h2>
                <input
                  type="text"
                  value={codalQuery}
                  onChange={(e) => setCodalQuery(e.target.value)}
                  placeholder="Search Article number or keyword (e.g., '248', 'Obligations', 'Damages')..."
                  className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 text-slate-200"
                />

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                  {codals
                    .filter(c => c.art.toLowerCase().includes(codalQuery.toLowerCase()) || c.title.toLowerCase().includes(codalQuery.toLowerCase()) || c.details.toLowerCase().includes(codalQuery.toLowerCase()))
                    .map((item, idx) => (
                      <div key={idx} className="bg-slate-900 border border-slate-800 rounded-xl p-4 hover:border-amber-500/40 transition-colors">
                        <span className="text-xs font-bold text-amber-400 uppercase tracking-wider">{item.art}</span>
                        <h3 className="text-base font-semibold text-slate-100 my-1">{item.title}</h3>
                        <p className="text-xs text-slate-400 leading-relaxed">{item.details}</p>
                      </div>
                    ))}
                </div>
              </div>
            )}

            {/* TAB 3: FLASHCARDS */}
            {activeTab === 'cards' && (
              <div className="bg-slate-950/60 border border-slate-800 rounded-2xl p-6 flex flex-col gap-4">
                <h2 className="text-lg font-semibold text-amber-400">🎴 Active Recall Legal Flashcards</h2>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {flashcards.map(card => (
                    <div key={card.id} className="bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col justify-between gap-4">
                      <div>
                        <span className="text-xs font-semibold text-slate-500 uppercase">Question</span>
                        <p className="text-sm font-medium text-slate-200 mt-1">{card.question}</p>
                      </div>

                      {showAnswer[card.id] && (
                        <div className="border-t border-slate-800 pt-3">
                          <span className="text-xs font-semibold text-amber-400 uppercase">Answer & Elements</span>
                          <p className="text-xs text-slate-300 mt-1 whitespace-pre-line leading-relaxed">{card.answer}</p>
                        </div>
                      )}

                      <button
                        onClick={() => setShowAnswer(prev => ({ ...prev, [card.id]: !prev[card.id] }))}
                        className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg transition-colors"
                      >
                        {showAnswer[card.id] ? 'Hide Answer' : 'Show Answer'}
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 4: SETTINGS */}
            {activeTab === 'settings' && (
              <div className="bg-slate-950/60 border border-slate-800 rounded-2xl p-6 max-w-2xl mx-auto flex flex-col gap-6">
                <div>
                  <h2 className="text-lg font-semibold text-amber-400">⚙️ Gemini API Configuration</h2>
                  <p className="text-xs text-slate-400 mt-1">Your key is stored 100% locally in your browser storage. It is never sent to any external server besides Google's official Gemini API endpoint.</p>
                </div>

                <div className="flex flex-col gap-2">
                  <label className="text-xs font-medium text-slate-300">Google Gemini API Key</label>
                  <input
                    type="password"
                    value={apiKey}
                    onChange={(e) => setApiKey(e.target.value)}
                    placeholder="AIzaSy..."
                    className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 text-slate-200"
                  />
                </div>

                <button
                  onClick={saveKey}
                  className="py-3 bg-amber-500 hover:bg-amber-600 font-semibold text-slate-950 rounded-xl transition-colors"
                >
                  Save API Key Locally
                </button>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-slate-800/80 py-4 text-center text-xs text-slate-500">
            Miriam Law Assistant • Built for law students • Powered by Gemini AI
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MiriamApp />);
  </script>
</body>
</html>
